[project]
name = "tracker"
version = "0.1.0"
description = "Weekly GitHub trending for AI Agents and Quant repositories"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3",
    "httpx>=0.27",
    "jinja2>=3.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
