name: Weekly update

on:
  schedule:
    - cron: "0 0 * * 1" # Mondays 00:00 UTC (08:00 Beijing)
  workflow_dispatch:

permissions:
  contents: write # commit snapshots and issues
  pages: write
  id-token: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install .

      - name: Run tests
        run: |
          pip install pytest
          pytest -q

      - name: Collect, rank and translate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m tracker update

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: weekly update $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Build site
        run: python -m tracker build --out _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Fail if translation is misconfigured
        run: |
          if [ -f translation_error.txt ]; then
            echo "::error::$(cat translation_error.txt)"
            exit 1
          fi
